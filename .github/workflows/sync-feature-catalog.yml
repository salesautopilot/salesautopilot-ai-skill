name: Sync feature catalog

# Pulls the "Funkciók" Webflow CMS collection and commits the regenerated catalog straight to main
# when it changed. No PR review step: the catalog only contains text already public on
# salesautopilot.hu, and the internal "Háttérinformációk" field is never exported.
# Requires the WEBFLOW_API_TOKEN repository secret (a Webflow site token with cms:read scope).

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Regenerate catalog
        run: node scripts/sync-feature-catalog.mjs
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Claude Code only offers a plugin update to users when the plugin version changes.
      - name: Bump plugin patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Rewrites only the version string so the hand-formatted manifest keeps its layout.
          node -e '
            const fs = require("fs");
            const file = "salesautopilot/.claude-plugin/plugin.json";
            const source = fs.readFileSync(file, "utf8");
            fs.writeFileSync(file, source.replace(/("version":\s*")(\d+)\.(\d+)\.(\d+)"/,
              (_, prefix, major, minor, patch) => `${prefix}${major}.${minor}.${Number(patch) + 1}"`));
          '

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync feature catalog from Webflow CMS"
          git push origin HEAD:main

  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
