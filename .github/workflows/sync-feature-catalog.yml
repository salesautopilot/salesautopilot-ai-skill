name: Sync feature catalog

# Pulls the "Funkciók" Webflow CMS collection and opens a PR when the generated catalog changed.
# Requires the WEBFLOW_API_TOKEN repository secret (a Webflow site token with cms:read scope) and
# "Allow GitHub Actions to create and approve pull requests" enabled in Settings → Actions → General.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate catalog
        run: node scripts/sync-feature-catalog.mjs
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Claude Code only offers a plugin update to users when the plugin version changes.
      - name: Bump plugin patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const file = "salesautopilot/.claude-plugin/plugin.json";
            const plugin = JSON.parse(fs.readFileSync(file, "utf8"));
            const [major, minor, patch] = plugin.version.split(".").map(Number);
            plugin.version = `${major}.${minor}.${patch + 1}`;
            fs.writeFileSync(file, JSON.stringify(plugin, null, 2) + "\n");
          '

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/feature-catalog
          delete-branch: true
          commit-message: Sync feature catalog from Webflow CMS
          title: Sync feature catalog from Webflow CMS
          body: |
            Automated update of `salesautopilot/skills/salesautopilot-feature-catalog/references/feature-catalog.md` from the Webflow "Funkciók" collection, plus a plugin patch version bump.

            Review before merging: the repository is public, so check that no internal-only text slipped into the CMS tooltips or package notes.
